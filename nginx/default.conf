server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança. CSP fica de fora de propósito: uma política errada quebra a
    # aplicação em silêncio, e a correta depende de quais domínios o projeto passa a usar.
    #
    # Estão repetidos em cada location que usa add_header, e não por engano: no nginx um
    # add_header dentro de um bloco DESCARTA todos os herdados do bloco acima. Sem a repetição,
    # o /index.html — justamente o documento que o clickjacking ataca — sairia sem nenhum deles.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Arquivos com hash no nome nunca mudam de conteúdo: cache longo e imutável.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html precisa ser revalidado sempre, senão o navegador serve uma versão antiga que
    # aponta para chunks que o deploy já apagou — a tela branca clássica depois de publicar.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer caminho desconhecido devolve o index e o roteador decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
