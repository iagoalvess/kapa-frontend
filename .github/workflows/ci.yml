name: CI

# Os mesmos comandos do README, na mesma ordem. Se o CI e a máquina do desenvolvedor
# divergirem, o CI vira ruído e as pessoas param de olhar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        # npm ci respeita o lock: build reproduzível, e falha se o lock estiver desatualizado.
        run: npm ci

      - name: Conferir formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

  imagem:
    # Só confirma que a imagem constrói. Publicar é outro workflow, com credenciais.
    runs-on: ubuntu-latest
    needs: verificacao

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VITE_API_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max
