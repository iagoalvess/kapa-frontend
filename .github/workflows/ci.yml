name: CI

# Os mesmos comandos do README, na mesma ordem. Se o CI e a máquina do desenvolvedor
# divergirem, o CI vira ruído e as pessoas param de olhar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        # npm ci respeita o lock: build reproduzível, e falha se o lock estiver desatualizado.
        run: npm ci

      - name: Dependências vulneráveis
        run: npm audit --audit-level=high

      - name: Conferir formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build && npm run build:site
        env:
          VITE_API_URL: http://localhost:8080
          VITE_APP_URL: http://localhost:5173
          VITE_SITE_URL: http://localhost:5180

  segredos:
    # Varre o histórico inteiro com as regras padrão do gitleaks.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Varrer segredos
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact
